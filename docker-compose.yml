# Postgres + the two Python sidecars. Ollama runs on the HOST (:11434); rag-api and
# web run on the host via Bun/Next. Values interpolate from .env (see .env.example).
name: arnfar

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arnfar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-arnfar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arnfar} -d ${POSTGRES_DB:-arnfar}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  lao-nlp:
    build:
      context: ./services/lao-nlp
      args:
        # 0 = small image, /rerank answers 503. Set LAO_NLP_RERANKER=1 in .env and rebuild
        # to bake in bge-reranker-v2-m3 (~2.5 GB) for the `hybrid-rrf+rerank` eval arm.
        WITH_RERANKER: ${LAO_NLP_RERANKER:-0}
    restart: unless-stopped
    ports:
      - "7731:7731"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7731/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  docx-extractor:
    build: ./services/docx-extractor
    restart: unless-stopped
    ports:
      - "7732:7732"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7732/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── the application itself ────────────────────────────────────────────────
  # Behind the "app" profile, so the default `docker compose up -d` still brings up only
  # infrastructure and leaves rag-api/web to `bun run dev:*` on the host — the fast inner
  # loop. Use `docker compose --profile app up -d` for the full containerised stack: a
  # client install, or a smoke test of what actually ships.
  #
  # Ollama stays on the HOST in both modes; it needs the GPU, and CLAUDE.md keeps all
  # inference outside the container boundary.

  rag-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/rag-api/Dockerfile
    restart: unless-stopped
    ports:
      - "${RAG_API_BIND:-0.0.0.0}:${RAG_API_PORT:-7730}:7730"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LAO_NLP_URL: http://lao-nlp:7731
      DOCX_EXTRACTOR_URL: http://docx-extractor:7732
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CORS_ALLOW_PRIVATE_NETWORK: ${CORS_ALLOW_PRIVATE_NETWORK:-false}
      # Inside a container, loopback would make the published port unreachable — the
      # boundary here is the port mapping below, not the bind address.
      RAG_API_HOST: 0.0.0.0
      DEV_HF_ID: ${DEV_HF_ID}
      DEV_COMPANY_ID: ${DEV_COMPANY_ID}
      NODE_ENV: production
      LOG_FORMAT: json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/repo/storage
      - ./datasets:/repo/datasets
    depends_on:
      postgres:
        condition: service_healthy
      lao-nlp:
        condition: service_healthy
      docx-extractor:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time — the browser resolves this, so it
        # must be an address the browser can reach, not a compose service name. Empty by
        # default so the page derives it from the address it was opened on, which is what
        # lets the same image serve localhost and a LAN IP.
        NEXT_PUBLIC_RAG_API_URL: ${NEXT_PUBLIC_RAG_API_URL:-}
        RAG_API_PORT: ${RAG_API_PORT:-7730}
    restart: unless-stopped
    ports:
      # Publish on all interfaces so the LAN can reach it; set WEB_BIND=127.0.0.1 to keep
      # it on this machine only.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      - rag-api

volumes:
  pgdata:
