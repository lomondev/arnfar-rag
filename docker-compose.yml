# Postgres + the two Python sidecars. Ollama runs on the HOST (:11434); rag-api and
# web run on the host via Bun/Next. Values interpolate from .env (see .env.example).
name: arnfar

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arnfar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-arnfar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arnfar} -d ${POSTGRES_DB:-arnfar}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  lao-nlp:
    build: ./services/lao-nlp
    restart: unless-stopped
    ports:
      - "7731:7731"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7731/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  docx-extractor:
    build: ./services/docx-extractor
    restart: unless-stopped
    ports:
      - "7732:7732"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7732/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
